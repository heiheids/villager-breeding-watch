# Villager Breeding Watch -- Minecraft 26.3 Fabric
# 26.x: Minecraft is no longer obfuscated, so:
#   * plugin is net.fabricmc.fabric-loom (no -remap suffix)
#   * no mappings line
#   * dependencies use implementation, not modImplementation
#
# GRADLE_USER_HOME is pointed at .gradle-home inside this project by tools\build.ps1,
# which is pre-seeded with the 26.3 Loom cache so the build can run offline.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false

# Fabric coordinates (verified 26.3 combination)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4

# Mod info
version=1.1.0
group=com.heishandashu
archives_base_name=villager-breeding-watch

# Dependencies
fabric_api_version=0.162.0+26.3