# Villager Breeding Watch -- Minecraft 26.3 NeoForge
# Pure ASCII on purpose: Gradle reads this file as ISO-8859-1.
# GRADLE_USER_HOME is set by tools\build.ps1 to .gradle-home inside this project.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false

# Target platform.
# NOTE: the offline build cache only has NeoForge 26.3.0.67-beta compile artifacts,
# while the target instance runs 26.3.0.86. Compile against 0.67-beta and declare the
# dependency lower bound as [26.3.0.67-beta,) so 0.86 satisfies it.
minecraft_version=26.3
neoforge_version=26.3.0.67-beta
moddev_version=2.0.148

# Mod info (shared version number with the Fabric branch)
version=1.1.1
group=com.heishandashu
archives_base_name=villager-breeding-watch
